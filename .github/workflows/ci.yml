name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m pytest tests/gdb-scripts/tests --no-cov
      - run: python -m compileall -q tests/gdb-scripts/_gdb
      - run: make -C tests/gdb-scripts/tests

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check baldrick tests
      - run: python -m ruff check baldrick tests
      - run: python -m ruff check tests/gdb-scripts
      - run: python -m ruff format --check tests/gdb-scripts
      - run: python -m mypy baldrick
